<script>U.DTPL={"dog": ["именуемый в дальнейшем Заказчик, с одной стороны, и {C_NAME}, именуемое в дальнейшем Подрядчик, в лице {C_REP}, действующего на основании Устава, с другой стороны, вместе именуемые Стороны, заключили настоящий Договор о нижеследующем:", "1. Предмет договора.", "1.1. Заказчик поручает, а Подрядчик принимает на себя обязательства по выполнению ремонтно-отделочных работ (далее – Работы) в жилом помещении/нежилом помещении площадью {AREA} кв.м., расположенном по адресу: {ADDR} (далее – Объект).", "1.2. Работы производятся Подрядчиком на Объекте, указанном в п.1.1. настоящего Договора, а именно в следующих помещениях Объекта: {ROOMS}.", "1.3. Перечень подлежащих выполнению Работ указывается и согласовывается Сторонами в Смете на производство работ (далее по тексту – Смета), являющейся неотъемлемой частью Договора (Приложение № 1 к настоящему Договору).", "1.4. Работы, не указанные в Смете, считаются дополнительными работами и могут быть выполнены Подрядчиком по договоренности Сторон на основании Дополнительных соглашений к настоящему Договору и за отдельную плату, определенную в них по стоимости работ на такой момент по действующему Прайсу.", "1.5. При отсутствии в Дополнительных соглашениях к настоящему Договору по отдельным видам Работ, каких-либо специальных условий выполнения Работ, Стороны руководствуются условиями настоящего Договора.", "1.6. Согласование Заказчиком Сметной документации подтверждает полное информирование Подрядчиком Заказчика, с предоставлением ему всей необходимой и достоверной документации и сведений об объемах, составе и качестве согласованных Сторонами работ, ее видах и особенностях, гарантийных обязательствах Подрядчика, требованиях к эксплуатации Объекта, сведений о цене работ и материалов, а также форме оплаты по настоящему Договору.", "2. Стоимость работ и порядок расчетов.", "2.1. Стоимость Работ по настоящему Договору определяется Прейскурантом Подрядчика, а также согласованной Сторонами Сметой на производство Работ, и составляет: {SUM} , НДС не облагается согласно п.2 статьи 346.11 главы 26.2 НК РФ, в связи с применением {C_NAME} упрощенной системы налогообложения.", "2.2. Стоимость Работ по Договору, отраженная в Смете, может быть изменена по соглашению Сторон, как в сторону увеличения, так и в сторону уменьшения. В случае внесения изменений в Смету, Стороны подписывают соответствующее Дополнительное соглашение к настоящему Договору. При согласовании нового перечня Работ Подрядчик вправе подготовить Смету по актуальным ценам на виды Работы, определенным в действующем Прайсе Подрядчика на такой момент. В случае неполучения Подрядчиком в течение двух дней, с момента направления, новой согласованной Сметы со стороны Заказчика или мотивированного возражения от ее согласования, такая Смета считается согласованной Сторонами.", "2.3. Работы по Договору выполняются из материала Заказчика. Стоимость материала в стоимости настоящего Договора и Смете не учитывается.", "2.4. Подрядчик вправе оказывать Заказчику услуги по привлечению сторонних поставщиков отделочных и иных материалов для выполнения Работ по Договору на основании заявок со стороны Заказчика.", "2.5. Оплата выполненных Подрядчиком Работ производится Заказчиком каждые 10 (десять) календарных дней на основании составленного, направленного Подрядчиком и согласованного Сторонами Акта приема-передачи выполненных работ, по факту выполнения одного вида работ, либо ранее указанного срока - в случае, если стоимость выполненных Подрядчиком Работ одного вида превысит 100 000 (сто тысяч) рублей. Оплата такого Акта приема-передачи выполненных работ производится Заказчиком в срок не более 2 (двух) календарных дней с момента его предоставления Подрядчиком.", "2.6. Оплата выполненных Подрядчиком Работ по настоящему Договору может производиться Заказчиком в кассу Подрядчика и/или в безналичном порядке на расчетный счет Подрядчика, указанный в условиях настоящего Договора, как за счет собственных средств, так и с помощью привлечения кредитных / заемных средств в банковских учреждениях. При этом оплату от имени Заказчика указанных Работ могут производить банковские учреждения. При оформлении Заказчиком кредитного договора для оплаты стоимости Работ по Договору, в случае не полной выработки объема Работ по вине Заказчика и/или отказа Заказчика от исполнения Договора в одностороннем порядке, банковскую комиссию, согласно процентной ставки по кредитному договору с банком, оплачивает в полном объеме Заказчик.", "2.7. Окончательная стоимость выполненных Работ по настоящему Договору определяется суммой всех подписанных сторонами Актов приема-передачи выполненных работ. Согласование изменения цены работ, в том числе в случае возникновения необходимости дополнительных Работ, не предусмотренных Договором и Сметой, производится в письменной или электронной форме. Подписание Актов выполненных работ является достаточным подтверждением принятия Заказчиком измененной стоимости Работ. Смета не является твердой.", "2.8. Окончательные расчеты между Сторонами должны производиться не позднее 2 (двух) рабочих дней по окончании выполнения Работ Подрядчиком, с учётом всех произведенных Заказчиком авансовых платежей по настоящему Договору, в соответствии с окончательным Актом приема-передачи выполненных работ.", "2.9. Дополнительные Работы и затраты, не предусмотренные Сметой, необходимость осуществления которых установлена Сторонами при сдаче Объекта и отраженные в соответствующем Дополнительном соглашении к настоящему Договору, подписанному Сторонами, не могут являться причиной отказа Заказчика от оплаты Подрядчику стоимости Работ сданного Объекта.", "2.10. Сторонами определено и согласовано, что в случае повышения стоимости материалов, комплектующих и/или оборудования, используемых Подрядчиком при исполнении условий настоящего Договора и/или увеличения стоимости работ привлекаемых Подрядчиком субподрядчиков и/или иных исполнителей более, чем на 5% от стоимости таких материалов, комплектующих и оборудования и/или работ/услуг на дату заключения настоящего Договора, стоимость Работ по настоящему Договору может увеличиваться Подрядчиком в одностороннем порядке на размер увеличения такой стоимости материалов, комплектующих и/или оборудования и/или работ/услуг. При этом Подрядчик заблаговременно согласовывает такое увеличении стоимости с Заказчиком, до начала выполнения таких работ (или закупки таких материалов). Данный пункт относится только к разделу спецмонтажные работы.", "2.11. В случае предоставления Заказчику скидки на выполнение ремонтных работ, определенных Сметой №1 (Приложение №1 к настоящему Договору) ее размер указывается в Соглашении о предоставлении скидки, а окончательный расчет между Сторонами с учетом скидки, рассчитывается и фиксируется в Итоговом Акте выполненных работ. Скидка предоставляется при условии принятия и оплаты всех этапов работ, как предусмотренных Сметой № 1, так и согласованных в ходе выполнения работ в порядке, предусмотренном Договором. Сторонами отдельно согласовано, что скидка на спецмонтажные работы не предоставляется.", "3. Порядок и сроки выполнения работ.", "3.1. По условиям настоящего Договора Подрядчик приступает к началу выполнения Работ в течение 3 (трех) рабочих дней, с момента передачи Заказчиком Объекта по Акту приема-передачи (Приложение №5 к настоящему Договору), который подписывается обеими Сторонами и является неотъемлемой частью настоящего Договора. Срок выполнения Работ по настоящему Договору определяется Сторонами в Соглашении о сроке выполнения работ (Приложение №6 к настоящему Договору).", "Под рабочими днями (здесь и далее по тексту Договора) Стороны понимают все дни с понедельника по пятницу, кроме: выходных (субботы, воскресенья), праздничных и нерабочих (дат праздников и/или иных дней, объявленных нерабочими и установленных Государством).", "Стороны согласовали, что срок выполнения подрядных работ, предусмотренный настоящим Договором и заключаемыми Дополнительными соглашениями, увеличивается на срок по реализации Сторонами технических и технологических вопросов, в том числе, но не ограничиваясь вопросами по согласованию и оформлению актов выполненных работ и дополнительных соглашений, согласованию и обеспечению возможности работы иных подрядчиков на Объекте, возобновления выполнения Работ на Объекте, срок оплаты Работ, а также для согласования иных вопросов взаимодействия Сторон. Предусмотренный настоящим пунктом дополнительный срок увеличивает общий срок окончания работ на 20 (Двадцать) процентов от срока окончания работ и не требует дополнительного согласования и оформления.", "3.2. Подрядчик обязуется выполнить Работы в соответствии с согласованной Сторонами Сметой на Работы, согласованные в Дополнительных соглашениях к настоящему Договору, на основании стоимости Работ, указанных в Прейскуранте Подрядчика. В случае увеличения общего срока выполнения Работ по настоящему Договору по отношению к ранее согласованному Сторонами, произошедшее по вине Заказчика, более чем на один календарный месяц, стоимость Работ по ранее согласованной Смете подлежит пересмотру по инициативе Подрядчика.", "3.3. Сроки выполнения Работ могут быть изменены Сторонами путем внесения изменений в настоящий Договор. При этом Стороны подписывают соответствующее Дополнительное соглашение к нему. При этом Сторонами согласовано, что общий срок выполнения Работ по настоящему Договору автоматически продлевается на срок оплаты, определенном настоящим пунктом Договора и/или задержки оплаты Заказчиком Работ по предоставленному Подрядчиком Акту.", "3.4. Подрядчик вправе отступить от предусмотренных настоящим Договором сроков выполнения Работ и увеличить их, письменно и/или электронно, и/или иным способом, предусмотренным условиями настоящего Договора, уведомив об этом Заказчика, в следующих случаях:", "- не предоставления в срок Заказчиком материалов и монтируемых элементов, необходимых для выполнения Работ, либо предоставления их в недостаточном количестве, либо предоставления материалов, использование которых невозможно для выполнения Работ (в том числе и в связи с их качеством) – на период отсутствия материалов и монтируемых элементов;", "- невозможности выполнения работ на Объекте в определенные в настоящем Договоре временные промежутки (п.4.3. и п.4.6. настоящего Договора);", "- нарушения Заказчиком сроков оплаты Работ, определенных в настоящем Договоре и/или порядка проведения оплаты Работ – на период просрочки платежа;", "- предъявления Заказчиком мотивированных возражений относительно выполненных Работ (скрытых и/ или промежуточных Работ) и согласования Сторонами сроков устранения замечаний Заказчика – на период устранения Подрядчиком замечаний Заказчика;", "- выявления Подрядчиком и/или Заказчиком необходимости выполнения дополнительных Работ, не предусмотренных согласованной Сторонами Сметой – на период внесения изменений в Смету и подписания соответствующего Дополнительного соглашения к настоящему Договору об изменении объема Работ и сроков их выполнения, а равно с увеличением общего срока выполнения Работ в одностороннем порядке Подрядчиком на срок выполнения таких Дополнительных работ;", "- получения от Заказчика устного и/или письменного поручения о внесении изменений в Смету - на период внесения изменений в Смету и подписания соответствующего Дополнительного соглашения, а равно с увеличением общего срока выполнения Работ в одностороннем порядке Подрядчиком на срок выполнения таких Дополнительных работ;", "- необходимости согласования с Заказчиком проекта, дизайнерских либо технических решений относительно выполняемых Работ – на время их согласования;", "- непринятия Заказчиком мер (в том числе и неоплата услуг как Подрядчика, так и сторонних организаций) по вывозу из помещения строительного и иного мусора, затрудняющего дальнейшее выполнение Подрядчиком Работ – на период невозможности выполнения Работ из-за складирования мусора.", "- невозможности выполнения работ из-за действий третьих лиц (управляющей компании, ТСЖ и т.п.) – на период действия таких третьих лиц.", "3.5. В случае отступления Подрядчиком от предусмотренных Договором сроков выполнения Работ, Подрядчик письменно и/или электронно, и/или иным способом, предусмотренным условиями настоящего Договора уведомляет Заказчика о фактах, препятствующих выполнению Работ в установленный срок. Сроки начала и окончания работ по каждому этапу автоматически сдвигаются при возникновении обстоятельств, указанных в п. 3.4. Договора, на весь срок действия таких обстоятельств.", "3.6. Подрядчик вправе приостановить выполнение Работ по Договору, уведомив об этом Заказчика письменно и/или электронно, и/или иным способом, предусмотренным условиями настоящего Договора, с возможностью последующего одностороннего расторжения настоящего Договора, в следующих случаях:", "- не предоставления (не обеспечения) Заказчиком доступа сотрудников Подрядчика на Объект;", "- нарушения сроков оплаты Работ, предусмотренных условиями настоящего Договора;", "- обнаружения невозможности выполнения предусмотренных согласованной Сторонами Сметой Работ по причинам, не зависящим от Сторон;", "- выявления необходимости выполнения дополнительных Работ, не предусмотренных согласованной Сторонами Сметой, в случае недостижения Сторонами соглашения относительно внесения изменений в Смету;", "- отсутствия мотивированных ответов на запросы Подрядчика более чем в течение 3 (трех) календарных дней;", "- невозможности выполнения работ из-за действий/бездействий третьих лиц (управляющей компании, ТСЖ и т.п.) и/или Заказчика;", "- получения от Заказчика поручения на проведение дополнительных Работ, требующих согласования контролирующих органов (согласование перепланировки или переоборудования помещения и др.).", "3.7. В случае приостановления ремонтных (отделочных) работ Подрядчик направляет Заказчику соответствующее уведомление письменно и/или электронно, и/или иным способом, предусмотренным условиями настоящего Договора.", "3.8. Стороны настоящим согласовали возможность сдачи-приемки Работ Подрядчиком как поэтапно, так и досрочно. Поэтапная сдача-приемка выполненных Работ может осуществляться с подписанием промежуточных актов приема-передачи выполненных работ в сроки и периоды, определенные Сторонами в настоящем Договоре.", "3.9. Заказчик вправе приостановить выполнение Работ по Договору, на срок суммарно в течение срока действия настоящего Договора не более двух календарных месяцев, уведомив об этом Подрядчика письменно и/или электронно, и/или иным способом, предусмотренным условиями настоящего Договора не менее чем за 2 (два) рабочих дня до приостановки, при условии оплаты Подрядчику фактически выполненных им Работ, в следующих случаях:", "- Использование Подрядчиком материалов несоответствующего качества, с предоставлением либо экспертного заключения, либо иных допустимых доказательств несоответствия таких материалов – до момента устранения Подрядчиком выявленных нарушений;", "- Грубого нарушения (два и более раз) условий настоящего Договора, которые зафиксированы в письменном виде Сторонами – до момента устранения Подрядчиком выявленных нарушений.", "4. Порядок выполнения работ.", "4.1. Подрядчик приступает к выполнению Работ после подписания Сторонами настоящего Договора со Сметой и принятия Объекта по Акту приема-передачи (Приложение № 5 к настоящему Договору), в порядке и сроки, определенные в п.3.1 настоящего Договора.", "4.2. Подрядчик обязан выполнить Работы по настоящему Договору своими силами, либо с привлечением третьих лиц (субподрядчиков). Привлечение субподрядчиков производится Подрядчиком без согласования с Заказчиком. В случае привлечения субподрядчиков ответственность за качество и сроки выполнения Работ по Договору данными лицами несет Подрядчик.", "4.3. Подрядчик обязан осуществлять Работы по Договору с соблюдением требований Закона г.Москвы от 12 июля 2002 г. N 42, а именно: не допускать совершение действий, нарушающих покой граждан и тишину, с 19 часов до 9 часов и с 13 часов до 15 часов, а также в воскресенье и нерабочие праздничные дни.", "4.4. Заказчик обязан принять и оплатить все выполненные Подрядчиком Работы в соответствии с условиями настоящего Договора", "4.5. Заказчик обязан самостоятельно получить и предоставить Подрядчику до момента выполнения им таких Работ разрешение на строительство; разрешение на перепланировку (переоборудование) Объекта в случае необходимости их получения в соответствии с законодательством РФ; схему инженерных сетей или инженерно-технический проект (в случае выполнения таких работ). Ответственность за поручение Подрядчику выполнить Работы, требующие получения таких разрешений, в их отсутствие, а также негативные последствия для Заказчика и третьих лиц, в результате выполнения таких Работ, в полной мере несет Заказчик.", "4.6. Заказчик обязан передать Подрядчику комплект ключей от Объекта (помещений), а также обеспечить ежедневно беспрепятственный доступ Подрядчика на Объект с 9-00 до 19-00 часов по мск для выполнения Работ по настоящему Договору, в т.ч. обеспечить наличие пропусков и разрешений для сотрудников Подрядчика в случае наличия контрольно-пропускного режима, а также обеспечить Подрядчику возможность выполнения Работ на Объекте в указанные в настоящем пункте временные промежутки. Заказчик принимает на себя обязательства подготовить объект к выполнению работ, а именно: накрыть полы, мебель собственными силами, если выполнение данных работ не согласовано с Подрядчиком. Ответственность за целостность упаковки, сохранность вещей и оборудования на Объекте несет Заказчик, если он их не передал по Акту Подрядчику. В случае причинения вреда имуществу Заказчика, сотрудниками Подрядчика, Подрядчик компенсирует стоимость имущества, исходя из оценочных факторов, только в том случае, если вина сотрудников Подрядчика будет определена. В случае если по согласованию Сторон подготовку объекта к ремонтным работам осуществляет Подрядчик, Заказчик обязан проверить качество такой подготовки перед началом выполнения работ. После проверки Заказчиком качества подготовки объекта и отсутствию претензий к Подрядчику, ответственность за сохранность мебели и других вещей на объекте несет Заказчик.", "4.7. Подрядчик за отдельную плату по заявке Заказчика может осуществлять разгрузку стройматериалов, необходимых для выполнения Работ по настоящему Договору. Стоимость услуг по разгрузке определяется в соответствии с Прейскурантом Подрядчика и не включена в стоимость выполняемых Подрядчиком Работ по настоящему Договору.", "4.8. Заказчик самостоятельно несет полную ответственность за качество материалов, приобретенных им для проведения Работ по настоящему Договору.", "4.9. Заказчик предоставляет Подрядчику свободный доступ и бесплатное пользование во время проведения Работ по настоящему Договору к водоснабжению, канализации и электричеству, а также обеспечивает своевременное отключение стояков отопления и водоснабжения силами сотрудником эксплуатирующей организации для проведения Подрядчиком Работ.", "4.10. Механизмы, оборудование и инструменты, необходимые для производства Работ, обеспечивает Подрядчик. Расходные материалы для оборудования и инструментов оплачиваются Заказчиком дополнительно. К расходным материалам относятся дополнительные принадлежности и оснастка (ведра, щетки малярные, валики малярные, емкости для хранения жидких и сыпучих материалов, иные материалы и приспособления).", "4.11. Строительный мусор собирается Подрядчиком в мешки и складируется в согласованном с Заказчиком на Объекте месте. Стоимость услуг по вывозу мусора определяется исходя из условий погрузки, необходимого тоннажа контейнера и территориального нахождения объекта и не включена в стоимость выполняемых Подрядчиком Работ по настоящему Договору.", "4.12. Влажная уборка Объекта может быть произведена Подрядчиком по просьбе Заказчика. Оплата уборки Объекта после проведения Подрядчиком Работ производится в соответствии с ценами, указанными в Прейскуранте Подрядчика", "4.13. Заказчик обязуется не вести никаких неофициальных переговоров с рабочими (сотрудниками Подрядчика) или неуполномоченными представителями Подрядчика, не производить с их помощью Работы, не предусмотренные настоящим Договором, не передавать им денежные средства за выполненную Работу, а равно не заключать с ними отдельные прямые договора (как устные, так и письменные) на выполнение Работ на Объекте.", "4.14. Исполнительная документация по Договору, в том числе, но не ограничиваясь, акты скрытых работ, исполнительные схемы инженерных сетей, общий журнал работ, инженерно-лабораторные исследования, оформляется на основании дополнительного соглашения, в котором определяются объем и вид. Стоимость формирования исполнительной документации определяется индивидуально. Дополнительное соглашение заключается с одновременным предоставлением Заказчиком рабочей и проектной документации, в ином случае Подрядчиком не формируется и не представляется исполнительная документация.", "4.15. Заказчик в рамках исполнения требований ФЗ №69 «О пожарной безопасности», при выполнении Работ обязан за свой счет обеспечить приобретение средств противопожарной безопасности в соответствии с действующими нормами на Объекте.", "4.16. В случае привлечения Заказчиком к выполнению каких-либо работ или оказанию услуг третьих лиц, Заказчик несет ответственность за вред причиненный данными лицами имуществу, находящемуся на Объекте или имуществу Подрядчика. При этом Заказчик обязан самостоятельно обеспечить рабочий процесс данных подрядчиков, в том числе обеспечить предоставление им необходимого материала и оборудования, очистку места проведения работ, а также уборку мусора по окончании и в процессе выполнения работ. При этом Заказчик может отдельно согласовать с Подрядчиком выполнение данных видов работ силами Подрядчика, с оплатой соответствующих работ за счет Заказчика.", "4.17. В случае, несогласованного с Подрядчиком, допуска Заказчиком на объект третьих лиц, Подрядчик не несет ответственность за повреждение результата выполненной работы, в том числе еще не принятой Заказчиком. В таком случае исправление всех повреждений и дефектов, выявленных Подрядчиком после данного факта, подлежат исправлению за счет Заказчика или иных лиц.", "5. Качество работ.", "5.1. Качество работ должно соответствовать действующим техническим условиям, ГОСТам, строительным нормам и правилам (СНиП) и сметной документации.", "5.2. На выполненные работы устанавливается гарантийный срок:", "- на сантехнические и электромонтажные работы - 2 года со дня подписания Сторонами акта сдачи-приемки работ;", "- на общестроительные работы – 1 год со дня подписания Сторонами акта сдачи-приемки работ.", "5.3. В случае не подписания Акта приема-передачи выполненных работ Заказчиком гарантийный срок исчисляется с даты направления Подрядчиком Заказчику Акта приема-передачи выполненных работ Почтой России либо на электронную почту Заказчика в соответствии с условиями Договора.", "5.4. Гарантийные обязательства не распространяются на отделку стен или потолков в новых домах (введенных в эксплуатацию менее пяти лет) с помощью красок, декоративных штукатурок и т.п., претензии в связи с появлением трещин при этом, связанных с усадкой дома, не принимаются. Гарантия не распространяется на повреждения лакокрасочных покрытий, а так же обои, декоративные и любые другие финишные покрытия, вызванные любым механическим воздействием или третьими лицами.", "5.5. В случае предоставления Заказчиком Объекта для выполнения ремонтно-строительных работ третьим лицам, либо выполнения работ самим Заказчиком в период гарантийного срока, либо ненадлежащего использования результата Работ, Подрядчик не несет материальной ответственности за выполненные работы по Договору.", "5.6. Заказчик обязан письменно уведомить Подрядчика обо всех претензиях, связанных с гарантией.", "5.7. После получения подобного уведомления Подрядчик должен в течение 14 (четырнадцати) рабочих дней информировать Заказчика о принятии мер по устранению выявленных дефектов. Подрядчик производит устранение выявленных дефектов Работы только при наличии установленной вины со своей стороны.", "5.8. При не полной оплате Заказчиком Работ, выполненных Подрядчиком (не оплате общей суммы работ по Акту приема-передачи выполненных работ), гарантия по настоящему Договору на неоплаченные Работы не предоставляется.", "5.9. Гарантия на работы по выравниванию поверхностей пола, стен, потолков (оштукатуривание, шпатлевание, стяжка пола, устройство наливного пола, монтаж конструкций из гипсокартона) предоставляется в рамках зоны ответственности Подрядчика, а именно на проявившиеся дефекты по монтажу данных поверхностей. Гарантийным случаем не является образование трещин или отслаивание поверхностей, в том числе смонтированных Подрядчиком, вызванных усадкой дома либо дефектом конструктивных и несущих поверхностей, смонтированных не Подрядчиком. Геометрия, горизонтальность, вертикальность и плоскость выполненных работ проверяется и принимается Заказчиком по акту выполненных работ, возможные претензии и замечания указываются в акте выполненных работ и должны быть устранены Подрядчиком в разумный срок, после подписания акта выполненных работ претензии по геометрии, горизонтальности, вертикальности и плоскости данных поверхностей не принимаются и устранению в рамках гарантийных обязательств не подлежат.", "5.10. Подрядчик гарантирует качество выполненных предчистовых, чистовых отделочных работ (поклейка обоев, окрашивание стен, укладка плитки, напольных покрытий, плинтусов, молдингов, а так же устройство любых декоративных поверхностей) , а так же соответствие их текущим строительным нормам и правилам при условии, что работы по устройству и выравниванию поверхностей стен, пола и потолков (черновые работы), а так же все предыдущие виды работ выполнены либо Подрядчиком либо перед началом выполнения такого соответствующего вида работ непосредственно Подрядчиком была проведена экспертиза выполненных не Подрядчиком работ и выдано заключение в письменном виде Заказчику о соответствии этих работ ГОСТ, СНиП, а так же внутренним стандартам качества Подрядчика.", "5.11. В случае, несогласованного с Подрядчиком, привлечения Заказчиком на объект третьих лиц для выполнения части работ либо отказа Заказчика от выполнения Подрядчиком каких-либо работ, указанных в смете и дополнительных соглашениях к настоящему договору, либо нарушения заказчиком своих обязательств по договору, а также в случае расторжения договора, гарантия качества на выполненные работы не предоставляется.", "5.12. Гарантийные обязательства аннулируются в случае выполнения Заказчиком самостоятельно или с привлечением третьих лиц любых строительно-монтажных работ на объекте в течение гарантийного периода без получения на то письменного согласия Подрядчика.", "6. Сдача и приемка работ.", "6.1. Сдача и приемка Работ оформляется соответствующим Актом приема-передачи выполненных работ, который подписывается Сторонами.", "6.2. Промежуточные Акты приема-передачи выполненных работ предоставляются Заказчику один раз в 10 (десять) календарных дней в электронном виде по электронной почте Заказчика, указанной в условиях настоящего Договора, и/или с использованием мессенджеров WhatsApp или Telegram, и/или в бумажном варианте нарочным и/или направляется Почтой РФ.", "6.3. Подписанные Подрядчиком Акты приема-передачи выполненных работ передаются Заказчику в 2-х экземплярах: один экземпляр для Заказчика, второй для Подрядчика. Заказчик обязан принять предоставленные Акты приема-передачи выполненных работ, в течение 2 (двух) календарных дней рассмотреть их, согласовать и направить второй подписанный экземпляр в адрес Подрядчика (или передать нарочно представителю Подрядчика). Заказчик в течение 2 (двух) календарных дней обязан предоставить Подрядчику мотивированное письменное возражение от принятия выполненных Работ и подписания Акта приема-передачи выполненных работ. В случае возникновения мотивированных возражений относительно объема и/или качества выполненных Работ, Заказчик обязан пригласить представителя Подрядчика для проведения двустороннего осмотра выявленных недостатков, составления двустороннего акта с указанием недостатков, сроков их устранения. При недостижении согласия между Заказчиком и Подрядчиком относительно выявленных недостатков, причин их возникновения, Заказчик обязан произвести строительно-техническую экспертизу для выявления и подтверждения недостатков в работе Подрядчика (при этом расходы по ее проведению в случае не выявления вины Подрядчика в таких недостатках лежат исключительно на Заказчике, в случае выявления вины Подрядчика – на Подрядчике).", "В случае, если в указанный срок мотивированные возражения против подписания Акта приема-передачи выполненных работ не будут заявлены Заказчиком, выполненные Подрядчиком работы считаются принятыми, а Акт приема-передачи выполненных работ считается подписанным. Направленное Заказчиком возражение рассматривается Подрядчиком в течение 2 (двух) рабочих дней, по результатам чего вносятся корректировки в Акт приема-передачи выполненных работ и/или согласовываются Сторонами в виде отдельного соглашения сроки устранения Подрядчиком выявленных объема или качества Работ, и/или Подрядчиком производятся доработки (исправления) в Работах и направляется новый Акт приема-передачи выполненных работ в адрес Заказчика, способом, определенным в п.6.2. настоящего Договора.", "6.4. Стороны определили, что Заказчиком по просьбе Подрядчика может предоставляться Письмо-отзыв о работе Подрядчика. Письмо-отзыв руководству о выполненной работе (Приложение №4 к настоящему Договору), Заказчик вправе заполнить в момент подписания Акта приема-передачи выполненных работ на своё усмотрение, в свободной форме, в целях улучшения работы Подрядчика. Заказчик соглашается с тем, что Подрядчик вправе опубликовать полученный от Заказчика отзыв на своем сайте в сети Интернет, а также использовать его иным образом в рекламных целях.", "6.5. Подписанный Сторонами Акт приема-передачи выполненных работ, а в случаях, предусмотренных п.6.3. настоящего Договора - односторонний Акт приема-передачи выполненных работ Подрядчика, который признается согласованным Заказчиком, является основанием для оплаты стоимости выполненных Подрядчиком Работ в полном объеме и стоимости, указанной в Акте приема-передачи выполненных работ.", "6.6. Стороны согласовали, что во время проведения работ Подрядчиком согласно смете и дополнительным соглашениям, на объекте Заказчика могут находиться только работники Подрядчика. Любые другие лица, в том числе изготовители мебели, мастера иных компаний, замерщики, на объекте могут присутствовать только с письменного согласия Подрядчика. Если данный пункт нарушается, Подрядчик не несет ответственности за выявленные нарушения в качестве исполняемых работ, в качестве чернового и чистового материала, и сохранность материалов и оборудования на объекте.", "7. Ответственность сторон.", "7.1. В случае ненадлежащего выполнения какой-либо из Сторон своих обязательств, виновная Сторона несёт ответственность в соответствии с действующим законодательством РФ.", "7.2. Стороны освобождаются от ответственности, если полное или частичное неисполнение их обязательств по договору явилось следствием обстоятельств непреодолимой силы, препятствовавших выполнению обязательств. Понятием обстоятельств непреодолимой силы охватываются внешние и чрезвычайные события, отсутствовавшие во время подписания Договора и наступившие помимо воли и желания Сторон, действия которых Стороны не могли предотвратить мерами и средствами, которые оправданно и целесообразно ожидать от добросовестно действующей Стороны. К подобным обстоятельствам Сторон относят: военные действия, эпидемии, пандемии, чрезвычайные положения, особые положения, природные катастрофы, акты и действия государственных органов, делающие невозможными исполнение обязательств по Договору в соответствии с законным порядком. В период действия обстоятельств непреодолимой силы, которые освобождают Стороны от ответственности, выполнение обязательств приостанавливается и санкции за неисполнение Договорных обязательств не применяются.", "7.3. Подрядчик несет ответственность за переданное ему по акту имущество, за любое действие, повлекшее за собой утрату или порчу имущества, если доказана вина Подрядчика в установленном порядке.", "7.4. Риск случайной гибели и/или случайной порчи материала в процессе транспортировки, а так же ответственность за его качество и комплектность, несет Сторона, предоставившая такие материалы.", "7.5. Заказчик обеспечивает личное присутствие либо присутствие своего уполномоченного представителя на Объекте, уполномоченного в установленном Законодательством РФ, принимать оперативные решения, по возникающим в процессе выполнения Работ по настоящему Договору вопросам, по уведомлению Подрядчика на электронную почту либо в мессенджере WhatsApp или Telegram Заказчика о дате встречи заблаговременно, не менее чем за 2 (два) календарных дня. В противном случае, неявка Заказчика является основанием для одностороннего продления Подрядчиком сроков выполнения работ по договору указанному в п.3.1.", "7.6. При нарушении Подрядчиком срока выполнения Работ, Заказчик вправе требовать выплаты договорной неустойки в виде пени в размере 0,5% от стоимости несвоевременно выполненных Работ за каждый день просрочки, но не более 10% от стоимости несвоевременно выполненной Работы, за исключением случаев, когда просрочка произошла по вине Заказчика либо вследствие непреодолимой силы.", "7.7. При несвоевременной оплате стоимости Работ по Договору Заказчик оплачивает Подрядчику пени в размере 0,5% от суммы неоплаченных Работ за каждый день просрочки, но не более 10% от стоимости неоплаченных Работ, за исключением случаев, когда просрочка произошла по вине Подрядчика либо в следствии непреодолимой силы.", "7.8. В случаях, когда Работы выполнены Подрядчиком с отступлениями от настоящего Договора, ухудшившими результат Работ, или с иными недостатками, Заказчик вправе по своему выбору в течение четырнадцати календарных дней с даты принятия Работ по Акту приема-передачи выполненных работ:", "7.8.1. потребовать от Подрядчика безвозмездного устранения недостатков в срок, не превышающий четырнадцати рабочих дней;", "7.8.2. потребовать от Подрядчика соразмерного уменьшения установленной за Работы цены;", "7.8.3. отказаться от исполнения настоящего Договора в одностороннем порядке. При этом Заказчик должен письменно уведомить Подрядчика не менее чем за 5 (пять) рабочих дней до предполагаемой даты прекращения Договора, а так же предоставить Подрядчику доступ на Объект для составления Акта приема-передачи выполненных работ на момент расторжения настоящего Договора, а так же предоставить Подрядчику возможность забрать с Объекта принадлежащие ему инструменты, оборудование. Работы и затраты, осуществленные на момент получения уведомления от Заказчика, не могут являться причиной отказа Заказчика от оплаты Подрядчику стоимости Работ, выполненных на Объекте на момент получения уведомления. Окончательный расчет за выполненные Работы по Объекту Заказчик должен произвести не позднее 3 (трех) рабочих дней с момента предоставления Подрядчиком Акта приема-передачи выполненных работ.", "7.9. Заказчик несет всю долю ответственности перед третьими лицами за правомерность использования Объекта при выполнении ремонтных работ Подрядчиком по настоящему Договору.", "7.10. В случае, когда замена водопроводного и/или канализационного стояков и/или стояков отопления производилась более 20 лет назад на момент заключения Договора, Подрядчик освобождается от ответственности за возникновение аварийных ситуаций на стояке и местах его соединения с заменяемыми элементами водопровода и канализации. Настоящим Заказчик уведомлен о необходимости замены таких систем каждые 20 лет.", "7.11. В случае выполнения работ для нанесения финишного покрытия (тонкослойные обои, покраска, декоративная штукатурка и прочее) Подрядчик сообщает о необходимости соблюдения следующих этапов работ: грунтование, штукатурка, грунтование, шпаклевка с применением стеклохолста, грунтование, шпаклевка с ошкуриванием, грунтование, финишное покрытие. При несоблюдении указанной последовательности этапов работ Заказчик проинформирован о том, что качество выполненных работ не оценивается с учетом положений СП 71.13330.2017 «Изоляционные и отделочные покрытия», СНиП 3.04.01-87. При согласовании вида работ «визуальное выравнивание стен» Заказчик проинформирован о том, что требования СП 71.13330.2017 «Изоляционные и отделочные покрытия», СНиП 3.04.01-87 не применяются. При включении указанных позиций в Смету или Акты выполненных работ Заказчик подтверждает информированный отказ от соблюдения технологий и отсутствие претензий по параметрам, предусмотренным СП 71.13330.2017 «Изоляционные и отделочные покрытия», СНиП 3.04.01-87.", "7.12. Подрядчик не несет ответственности перед Заказчиком и третьими лицами за повреждения/прорыв коммуникаций, систем отопления, водоснабжения и водоотведения (в том числе и запорной арматуры), которые произошли не по его вине (в том числе и в тех случаях, когда он не проводил ремонтные Работы, замену, обслуживание данных систем).", "7.13. В случае передачи Объекта для выполнения Работ Заказчиком третьим лицам без предварительного (за 10 (десять) календарных дней) письменного уведомления об этом Подрядчика, а равно – передача денежных средств за выполнение Работ, которые являются предметом настоящего Договора третьим лицам, в том числе Работникам Подрядчика, не являющимися материально ответственными лицами и не уполномоченными производить расчеты с Заказчиком, Подрядчик имеет право в одностороннем порядке расторгнуть настоящий Договор без уведомления об этом Заказчика. При этом он не будет нести никакой материальной ответственности (штраф, пеня, потерянная прибыль и выгода) перед Заказчиком.", "8. Разрешение споров.", "8.1. Стороны принимают необходимые меры к тому, чтобы любые спорные вопросы, разногласия или претензии, возникающие при исполнении настоящего Договора, были урегулированы путем взаимных переговоров.", "8.2. При недостижении соглашения Сторона, считающая, что ее право нарушено, обязана направить другой Стороне претензию по почте ценным письмом с описью вложения на почтовый адрес, указанный в Договоре. Получившая претензию Сторона обязана рассмотреть полученную претензию и направить ответ в течение 30 (тридцати) календарных дней с даты ее получения.", "8.3. Неразрешенные в претензионном порядке споры передаются на рассмотрение суда, в соответствии с действующим Законодательством РФ, в том числе и с учетом ст.17 Закона «О защите прав потребителей» (по месту нахождения Объекта, по месту регистрации Заказчика).", "8.4. К отношениям и разногласиям между сторонами, возникающим вследствие заключения, исполнения, нарушения, прекращения действия настоящего Договора, применяются нормы законодательства Российской Федерации.", "9. Иные условия.", "9.1. Настоящий Договор вступает в силу с момента его подписания обеими Сторонами и действует до полного исполнения обязательств Сторонами его условий.", "9.2. Заказчик вправе отказаться от исполнения Договора в любое время при условии оплаты Подрядчику фактически понесенных им расходов, связанных с исполнением обязательств по Договору, а также при условии оплаты фактически выполненных Подрядчиком Работ.", "9.3. Подрядчик вправе отказаться от исполнения Договора в одностороннем порядке в случае:", "- нарушения Заказчиком сроков оплаты Работ, предусмотренных настоящим Договором, более чем на 5 (пять) рабочих дней;", "- не предоставления Заказчиком разрешений, согласований, проектов необходимых для проведения Работ в соответствии с законодательством РФ;", "- прекращения или не предоставления (обеспечения) доступа сотрудников Подрядчика на Объект в течение более чем 5 (пять) рабочих дней;", "- не предоставления Заказчиком ответов на запросы Подрядчика более чем 5 (пять) рабочих дней;", "- невозможности выполнения работ из-за действий третьих лиц (управляющей компании, ТСЖ и т.п.) в течение более чем 5 (пяти) рабочих дней;", "- нарушения Заказчиком условий настоящего Договора, направленных на защиту деловой репутации Подрядчика, а равно нанесение ему своими действиями коммерческого вреда;", "- обнаружения невозможности выполнения предусмотренных Сметой Работ по причинам, не зависящим от Сторон, либо выявления необходимости выполнения дополнительных Работ, не предусмотренных Сметой, в случае недостижения Сторонами соглашения относительно внесения изменений в Смету в течение 5 (пяти) рабочих дней с даты обнаружения соответствующих обстоятельств.", "9.4. Заказчик соглашается с получением от Подрядчика смс-уведомлений на номер мобильного телефона:", "а также сообщений на адрес электронной почты:", "о проведении акций, предоставлении скидок, рекламных кампаниях, а также иную информацию о предоставляемых Подрядчиком услугах. Заказчик вправе в любое время уведомить Подрядчика по электронной почте о намерении прекратить получение данной информации.", "9.5. Заключая настоящий Договор, Заказчик гарантирует, что имеет полный объем прав владения, пользования и распоряжения Объектом, по которому проводятся ремонтные работы; а так же то, что к Подрядчику не будут предъявлены претензии со стороны третьих лиц (владельцев, государственных органов, арендаторов и т.д.) относительно выполнения данных работ на Объекте.", "9.6. Заключая настоящий Договор, Заказчик осведомлен о том, что все разговоры между сотрудниками Подрядчика и Заказчиком и/или его представителями записываются, с целью повышения уровня обслуживания и предотвращения каких-либо нарушений со стороны сотрудников Подрядчика.", "9.7. Заключая настоящий Договор, Заказчик гарантирует, что условия настоящего Договора полностью соблюдают его права как потребителя и не носят характера ущемления прав по отношению к установленным Законом.", "9.8. Сторонами определено, что ни в процессе исполнения условий настоящего Договора, ни после его истечения (по любым основаниям, в том числе и расторжении в одностороннем порядке стороной Заказчика) они будут предпринимать все меры к тому, что бы не распространять какую-либо информацию, не отвечающую действительности, которая может нанести репутационный и/или иной прямой коммерческий вред второй Стороне, в том числе публично заявлять о действиях/бездействии Подрядчика при исполнении условий настоящего Договора, указывать на его профессиональную несостоятельность и т.д.", "9.9. Вся переписка, документы, Акты, которые используются и оформляются во исполнение данного договора, могут быть направлены Сторонами друг-другу почтой, курьером, мессенджером WhatsApp или Telegram, или по электронной почте (контактные данные указаны в реквизитах Сторон настоящего Договора). Стороны признают, что все вышеперечисленное и другие документы, оформленные надлежащим образом и отправленные по электронной почте, а так же их электронные подписанные копии (экземпляры), будут иметь такую же юридическую силу, что и документация, составленная в письменной форме, и могут использоваться в качестве доказательств при рассмотрении возникающих споров и разбирательств по исполнению условий настоящего Договора. В случае изменения реквизитов и адресов, сторона Договора, у которой произошли изменения, обязана в течение 2 (Двух) рабочих дней известить другую Сторону. В случае не надлежащего исполнения данного обязательства вся ответственность за последствия лежит на Стороне, не исполнившей данное обязательство.", "9.10. Документы, уведомления и иная информация, полученные по электронной форме связи, считаются полученными в день отправки (при отправке с 00:00 до 18:00 по московскому времени в рабочие дни) либо на следующий рабочий день после отправки (при отправке с 18:00 до 00:00 по московскому времени).", "9.11. Сторонами определено, что Уполномоченным представителем со стороны Подрядчика при исполнении настоящего Договора, действующий на основании доверенности, является - ______________________________________________________________________________________.", "9.12. Заключая настоящий Договор, Заказчик дает свое согласие на обработку и передачу своих персональных (в том числе и контактных данных) Подрядчику и третьим лицам, которые в той или иной мере могут привлекаться к выполнению сопутствующих работ на Объекте (вывоз мусора, установка специального оборудования и/или выполнение специфических работ и т.д.) при исполнении условий настоящего Договора.", "9.13. В течение всего времени выполнения Работ по Договору все расходы по коммунальным услугам (электричество, водоснабжение и т.п.), а также все расходы по услугам управляющей компании (администрации здания или собственника помещения), в том числе, но не ограничиваясь: охрана, обустройство территории, использование лифта, уборка прилегающей территории, изготовление пропусков, подключение временного электричества и водоснабжения, установка пожарного гидранта и огнетушителя и т.п., а так же аренда (съем) жилья для временного проживания заказчика, в полном объеме оплачиваются за счет Заказчика.", "9.14. Стороны признают, что вся информация, содержащаяся в Договоре, а равно информация о ходе исполнения Договора является конфиденциальной и ни одна из Сторон Договора без письменного согласия другой Стороны не может распространять такую информацию в том числе с использованием информационно-телекоммуникационных сетей, включая сеть «Интернет». В случае нарушения настоящего пункта виновная в распространении такой информации Сторона обязана возместить потерпевшей Стороне причиненные такими действиями убытки.", "9.15. Стороны гарантируют друг другу, что лица, подписавшие настоящий Договор, имеют на то права и полномочия, и какие-либо ссылки на отсутствие прав и полномочий, полное или частичное, со Стороны любой из Сторон, возникающие после подписания настоящего Договора и в ходе его исполнения Сторонами, не могут служить основанием для неисполнения условий настоящего Договора полностью или в какой-либо части. В целях обеспечения исполнения обязательств по настоящему Договору Уполномоченный представитель со стороны Подрядчика, подписавший в том числе настоящий Договор, несет полную личную ответственность за исполнение Подрядчиком условий настоящего Договора в соответствии с действующим законодательством Российской Федерации (ст.363 ГК РФ). Со стороны Подрядчика по выполнению им условий настоящего Договора Уполномоченный представитель отвечает перед Заказчиком солидарно в рамках условий настоящего Договора и действующего Законодательства РФ.", "9.16. Стороны подтверждают, что подрядчик до заключения настоящего договора предоставил заказчику необходимую и достоверную информацию о предлагаемой работе, ее видах и об особенностях, о цене и форме оплаты, а также сообщил заказчику все относящиеся к договору и соответствующей работе сведения (ст. 732 ГК РФ).", "9.17. Договор составлен в двух экземплярах, имеющих одинаковую юридическую силу, по одному экземпляру для каждой из Сторон.", "9.18. Все изменения и дополнения к настоящему Договору имеют юридическую силу в случае, если они оформлены в письменном виде, подписаны обеими Сторонами."], "a3": ["именуемый в дальнейшем Заказчик, с одной стороны, и {C_NAME}, именуемое в дальнейшем Подрядчик, в лице {C_REP}, действующего на основании Устава, с другой стороны, вместе именуемые Стороны, составили настоящий акт сдачи-приемки выполненных работ по договору подряда № {NUM} от {DATE} (далее - Договор) о нижеследующем:", "1. В соответствии с условиями Договора Подрядчиком выполнены Работы согласно Смете (и согласованных Сторонами объемов) в полном объеме. Перечень выполненных Подрядчиком и принятых Заказчиком Работ указан в промежуточных Актах сдачи-приемки работ. Промежуточные Акты сдачи-приемки работ являются неотъемлемой частью настоящего Акта.", "2. Общая стоимость выполненных Работ составила ________________________ руб. _____ коп. (_________________________________________________________), без НДС.", "3. Заказчик выполненные Работы принял без претензий к Подрядчику относительно их качества и объема (в т.ч. скрытых Работ).", "4. Работы выполнены Подрядчиком в согласованные Сторонами сроки. Заказчик не имеет к Подрядчику претензий относительно сроков выполнения Работ.", "5. Объект передан Заказчику для эксплуатации.", "6. Подрядчик передал Заказчику ключи от Объекта.", "7. Настоящий Акт составлен в двух экземплярах, имеющих одинаковую юридическую силу, по одному экземпляру для каждой из Сторон.", "Претензии по гарантийному ремонту не принимаются в следующих случаях:", "1) после истечения гарантийного срока;", "2) при неправильной эксплуатации отремонтированного помещения;", "3) нормального износа объекта, а также на расходные материалы (фильтры, лампы и т.д.);", "4) ненадлежащего ремонта, переделки или преднамеренного повреждения объекта Заказчиком;", "5) при появлении дефектов на поверхностях и в их структуре, вызванных внешними воздействиями;", "6) по причинам, не зависящим от Исполнителя, таким как: оседание зданий, скрытые строительные дефекты, относящиеся к деятельности третьих лиц, и т.д.;", "7) в случае выполнения какого-либо действия третьими лицами до или после момента подписания данного Акта, Подрядчик не берет на себя ответственность за последствия данного действия.", "Замечания Заказчика:", "Работу сдал, от Подрядчика: Работу принял, от Заказчика:", "Форма акта сторонами согласована:"], "a4": ["Отзыв Заказчика о выполненной Подрядчиком работе:", "Качество работ:", "Сроки выполнения работ:", "Оценка мастеров Подрядчика:", "Оценка мастеров Подрядчика:", "Общая оценка организации работ Подрядчиком:"], "a5": ["именуемый в дальнейшем Заказчик, с одной стороны, и {C_NAME}, именуемое в дальнейшем Подрядчик, в лице {C_REP}, действующего на основании Устава, с другой стороны, вместе именуемые Стороны, составили настоящий Акт приема-передачи Объекта для выполнения работ по Договору подряда № {NUM} от {DATE} (далее – Договор) о нижеследующем:", "В соответствии с условиями Договора подряда № {NUM} от {DATE} Заказчик передал, а Подрядчик принял Объект, расположенный по адресу: {ADDR}, состоящий из {ROOMS} для проведения ремонтно-отделочных Работ в соответствии с согласованными условиями Договора и Сметой.", "Настоящий акт составлен в двух экземплярах, имеющих одинаковую юридическую силу, по одному экземпляру для каждой из Сторон."], "sogl": ["именуемый в дальнейшем Заказчик, с одной стороны, и {C_NAME}, именуемое в дальнейшем Подрядчик, в лице {C_REP}, действующего на основании Устава, с другой стороны, вместе именуемые Стороны, находясь в здравом уме и твердой памяти, действуя добровольно, заключили настоящее Соглашение в связи с заключением между ними Договора подряда № {NUM} от {DATE} (далее – Договор) о нижеследующем:", "1. Сторонами согласовано, что между ними заключается Договор подряда № {NUM} по выполнению ремонтно-отделочных работ (далее – Работы) в жилом помещении площадью {AREA} кв.м., расположенном по адресу: {ADDR} (далее – Объект).", "2. Стоимость Работ по Договору согласована Сторонами в размере {SUMR}, без НДС.", "3. В обеспечение дальнейшей оплаты Работ Подрядчика по Договору и исполнения условий Договора надлежащим образом, Заказчик производит оплату 5% (пяти процентов) от общей стоимости Работ по Договору, что составляет {SUM5}, без НДС.", "4. В случае отказа Заказчика от исполнения (и заключения) Договора подряда № {NUM} Подрядчиком производится частичный возврат полученных в рамках п.3 настоящего Соглашения денежных средств в размере 3% (трех процентов) от общей стоимости Работ по Договору, что составляет {SUM3}, без НДС.", "Остальные оплаченные Заказчиком денежные средства (в размере 2% (два процента) от общей стоимости Работ по Договору) засчитываются в качестве услуг Подрядчика по проведению замеров Объекта, составлению Сметной документации, оплаты накладных расходов по договорному оформлению правоотношений между Сторонами.", "5. Стороны определили, что приступают к исполнению принятых на себя обязательств по Договору подряда № {NUM} не позднее {START}", "6. В случае исполнения (и заключения) Сторонами Договора подряда № {NUM} Подрядчиком производится зачет произведенной в соответствии с п.3 настоящего Соглашения оплаты в счет оплаты Работ по Договору при оплате Заказчиком итогового Акта выполненных работ.", "7. Стороны не несут ответственность за неисполнение своих обязательств по настоящему Соглашению и Договору, если такое невыполнение вызвано обстоятельствами, возникшими помимо воли и желания Сторон, которые нельзя было предвидеть или избежать, включая принятие органами государственной власти и управления нормативных актов или совершение действий, введение мероприятий, связанных с пандемией, препятствующих выполнению Сторонами условий Договора.", "8. Данное Соглашение вступает в силу с момента его подписания обеими Сторонами.", "9. Все споры, возникающие между Сторонами в процессе исполнения настоящего Соглашения и Договора, разрешаются путем переговоров.", "10. Подписывая настоящее Соглашение, Стороны подтверждают, что изучили условия настоящего Соглашения и Договора подряда № {NUM} согласны со всеми их ключевыми условиями; заключили их исключительно на взаимовыгодных, оговоренных и согласованных условиях; готовы исполнять их надлежащим образом и в согласованные сроки.", "11. Данное Соглашение составлено в двух экземплярах, имеющих одинаковую юридическую силу, по одному экземпляру для каждой из Сторон. Подрядчик {C_NAME}"], "skid": ["именуемый в дальнейшем Заказчик, с одной стороны, и {C_NAME}, именуемое в дальнейшем Подрядчик, в лице {C_REP}, действующего на основании Устава, с другой стороны, вместе именуемые Стороны, находясь в здравом уме и твердой памяти, действуя добровольно, заключили настоящее Соглашение в связи с заключением между ними Договора подряда № {NUM} от {DATE} (далее – Договор) о нижеследующем:", "Сторонами согласовано, что стоимость работ по Договору подряда, согласно Смете №1 (Приложение №1 к Договору подряда), без учета скидки составляет {SUMFULL} , без НДС.", "Подрядчик предоставляет Заказчику скидку на все виды произведенных работ по Договору подряда в размере {DISC} , без НДС.", "Подрядчик рассчитывает Заказчику скидку, указанную в настоящем Соглашении, исключительно в итоговом Акте выполненных работ, при условии принятия и оплаты Заказчиком всех предыдущих этапов работ по Договору подряда в согласованные в Договоре подряда сроки.", "В случае, если сумма крайнего Акта выполненных работ менее суммы скидки, указанной в настоящем Соглашении, Подрядчик производит возврат суммы скидки из части ранее оплаченных Заказчиком денежных средств за выполненные Работы по настоящему Договору.", "В случае несоблюдения Заказчиком условий настоящего Соглашения скидка аннулируется и оплаты по Договору подряда производятся без учета скидок, определенных в настоящем Соглашении. Настоящее Дополнительное соглашение является неотъемлемой частью Договора подряда и обязательно для Сторон и вступает в силу с момента его подписания."], "a6": ["именуемый в дальнейшем Заказчик, с одной стороны, и {C_NAME}, именуемое в дальнейшем Подрядчик, в лице {C_REP}, действующего на основании Устава, с другой стороны, вместе именуемые Стороны, составили соглашение о сроке выполнения работ по договору подряда № {NUM} от {DATE} (далее - Договор) о нижеследующем:", "1. Сторонами согласовано, что срок выполнения Работ по Договору составляет {DAYS} рабочих дней с момента принятия Подрядчиком Объекта по Акту приема-передачи для выполнения работ по Договору подряда № {NUM} от {DATE}", "2. Данное Соглашение составлено в двух равнозначных экземплярах, по одному для каждой из Сторон и имеет юридическую силу в рамках исполнения обязательств по Договору.", "3. Данное Соглашение не нарушает права и законные интересы Сторон."], "a7": ["именуемый в дальнейшем Заказчик, в соответствии с Федеральным законом от 27.07.2006 №149-ФЗ «Об информации, информационных технологиях и о защите информации», Федеральным законом от", "27.07.2006 № 152-ФЗ «О персональных данных», Положением об обеспечении безопасности персональных данных при их обработке в информационных системах персональных данных, утвержденным Постановлением Правительства РФ от 17.11.2007г. №781, Положением об особенностях обработки персональных данных, осуществляемой без использования средств автоматизации, утвержденным Постановлением Правительства РФ от 15.09.2008г. №687, иными нормативно-правовыми актами, даю свое согласие на обработку своих персональных данных, а именно: фамилии, имени и отчества, паспортных данных, ИНН, адреса регистрации, номера телефона, электронной почты, иных персональных данных (далее Обработка ПД) предоставленной {C_NAME} (далее – Оператор обработки ПД), в рамках и целях исполнения условий Договора № {NUM} от {DATE} (далее - Договор).", "Обработка персональных данных может совершаться с использованием средств автоматизации или без использования таких средств с персональными данными, включая сбор, запись, систематизацию, накопление, хранение, уточнение (обновление, изменение), извлечение, использование, передачу (распространение, предоставление, доступ), обезличивание, блокирование, удаление, уничтожение персональных данных с целью исполнения обязательств принятых по условиям Договора, иных обязательств, предусмотренных указанным Договором.", "Срок использования предоставленных персональных данных – на срок действия Договора или до получения письменного уведомления о запрете на обработку персональных данных."], "road": ["1. В рамках исполнения указанного Договора подряда Заказчику были переданы Подрядчиком следующие документы:", "1.1 Договор подряда № {NUM} от {DATE}", "1.2 Смета (Приложение №1) к договору", "1.3 Прейскурант на виды работ (Приложение №2) к договору", "2. Подписывая указанный Договор подряда Заказчик подтверждает, что ознакомлен и соглашается с вышеперечисленными условиями (требованиями) по порядку выполнения оплат:", "2.1 Оплата услуг Подрядчика производится со стороны Заказчика исключительно после подписания Актов выполненных работ и получения им второго экземпляра подписанного сторонами Акта.", "2.2 Оплата услуг Подрядчика производится Заказчиком в безналичном порядке на расчетный счет Подрядчика через любое банковское учреждение, либо непосредственно в кассу Подрядчика в месте расположения его офиса, либо через уполномоченного представителя (с предъявлением соответствующих документов, подтверждающих его полномочия).", "2.3 Оплату оказанных Подрядчиком услуг по Договору подряда производит непосредственно сам Заказчик или надлежащим образом уполномоченный им представитель (наличие нотариальной доверенности обязательно).", "2.4 В случае возникновения внештатной ситуации как на объекте, так и недопониманий с представителями Подрядчика и/или третьими лицами, представляющимися представителями Подрядчика, Заказчик обязуется незамедлительно связаться с Подрядчиком по номеру телефона 8 (499) 495-11-97"]};</script>
